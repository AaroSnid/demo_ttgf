# Tiny Tapeout project information
project:
  title:        "8 Bit Counter"      # Project title
  author:       "Aaron Snider"      # Your name
  discord:      ""      # Your discord username
  description:  "8 bit programmable binary counter with asynchronous reset, synchronous load, and tri-state bidirectional outputs."      # Description[cite: 2]
  language:     "Verilog" #[cite: 2]
  clock_hz:     10000000       # Clock frequency set to 10 MHz[cite: 2]

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_8bit_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "load_input"
  ui[1]: "output_enable"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional Pins
  uio[0]: "io_data[0]"
  uio[1]: "io_data[1]"
  uio[2]: "io_data[2]"
  uio[3]: "io_data[3]"
  uio[4]: "io_data[4]"
  uio[5]: "io_data[5]"
  uio[6]: "io_data[6]"
  uio[7]: "io_data[7]"

# Do not change!
yaml_version: 6
